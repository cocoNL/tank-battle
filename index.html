<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 - Tank Battle</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  font-family: 'Courier New', monospace;
}
#game-wrapper {
  position: relative;
  border: 3px solid #555;
  box-shadow: 0 0 30px rgba(0, 200, 0, 0.3);
}
canvas { display: block; background: #111; }
#ui {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 40px;
  color: #fff;
  font-size: 16px;
  pointer-events: none;
}
#ui span { color: #0f0; font-weight: bold; }
#start-screen, #game-over-screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,0.85);
  color: #fff;
}
#start-screen h1, #game-over-screen h1 {
  font-size: 48px;
  color: #0f0;
  margin-bottom: 20px;
  text-shadow: 0 0 20px #0f0;
}
#game-over-screen h1 { color: #f00; text-shadow: 0 0 20px #f00; }
.controls { color: #aaa; font-size: 14px; margin-top: 20px; line-height: 1.8; }
.controls kbd {
  background: #333;
  border: 1px solid #666;
  border-radius: 3px;
  padding: 2px 6px;
  color: #fff;
}
.btn {
  margin-top: 20px;
  padding: 12px 40px;
  font-size: 20px;
  background: #0f0;
  color: #000;
  border: none;
  cursor: pointer;
  font-family: inherit;
  font-weight: bold;
  border-radius: 5px;
  transition: background 0.2s;
}
.btn:hover { background: #0c0; }
#game-over-screen { display: none; }
.hidden { display: none !important; }
#level-indicator {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #0f0;
  font-size: 36px;
  font-weight: bold;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
  text-shadow: 0 0 20px #0f0;
}
</style>
</head>
<body>
<div id="game-wrapper">
  <canvas id="game"></canvas>
  <div id="ui">
    <div>生命 <span id="lives">3</span></div>
    <div>分数 <span id="score">0</span></div>
    <div>关卡 <span id="level">1</span></div>
    <div>敌人 <span id="enemies-left">0</span></div>
  </div>
  <div id="level-indicator"></div>
  <div id="start-screen">
    <h1>坦 克 大 战</h1>
    <p style="font-size:18px;color:#aaa;">BATTLE CITY</p>
    <div class="controls">
      <kbd>W A S D</kbd> 或 <kbd>&uarr; &larr; &darr; &rarr;</kbd> 移动<br>
      <kbd>空格</kbd> 或 <kbd>J</kbd> 射击
    </div>
    <button class="btn" onclick="startGame()">开始游戏</button>
  </div>
  <div id="game-over-screen">
    <h1 id="go-title">GAME OVER</h1>
    <p style="font-size:20px;color:#fff;">最终分数: <span id="final-score" style="color:#0f0;">0</span></p>
    <button class="btn" onclick="startGame()">再来一局</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const COLS = 26;
const ROWS = 26;
const CELL = 24;
canvas.width = COLS * CELL;
canvas.height = ROWS * CELL;

const TILE = { EMPTY: 0, BRICK: 1, STEEL: 2, WATER: 3, BASE: 4 };
const DIR = { UP: 0, RIGHT: 1, DOWN: 2, LEFT: 3 };

let grid, player, enemies, bullets, particles, explosions;
let score, lives, level, enemiesRemaining, enemiesSpawned, gameRunning, gameOver;
let keys = {};
let spawnTimer, enemyShootTimer;
let playerShootCooldown = 0;
const PLAYER_SHOOT_DELAY = 15;
const ENEMY_SHOOT_INTERVAL = 40;

const tileColors = {
  [TILE.BRICK]: '#b55a30',
  [TILE.STEEL]: '#888',
  [TILE.WATER]: '#2266cc',
  [TILE.BASE]: '#ff0',
};

const LEVELS = [
  // Level 1
  [
    '##########################',
    '#............#...........#',
    '#..####..###..###..####..#',
    '#..#........#........#..#',
    '#..#..##.... ....##..#..#',
    '#......##..###..##......#',
    '#..##..#........#..##..#',
    '#..##..##....##..##....#',
    '#......##......##......#',
    '#..##....####....##..#',
    '#..##..#..##..#..##..#',
    '#........#....#........#',
    '#..####..####..####..#',
    '#.....#........#.....#',
    '#.....#..####..#.....#',
    '###..#..#....#..#..###',
    '#......#....#......#',
    '#..##..##..##..##..#',
    '#....#........#....#',
    '#..##..####..##..#',
    '#......#....#......#',
    '#..##........##..#',
    '#..##..####..##..####..#',
    '#........#........#..#',
    '#..####..###..###......#',
    '##########################',
  ],
  // Level 2
  [
    '##########################',
    '#......##......##......#',
    '#..##..##..##..##..##..#',
    '#..##......##......##..#',
    '#..##..##..##..##..##..#',
    '#......##......##......#',
    '###..##..##..##..##..###',
    '#......##......##......#',
    '#..##..##..##..##..##..#',
    '#..##......##......##..#',
    '#..##..##..##..##..##..#',
    '#......##......##......#',
    '###..##..##B.##..##..###',
    '#......##......##......#',
    '#..##..##..##..##..##..#',
    '#..##......##......##..#',
    '#..##..##..##..##..##..#',
    '#......##......##......#',
    '###..##..##..##..##..###',
    '#......##......##......#',
    '#..##..##..##..##..##..#',
    '#..##......##......##..#',
    '#..##..##..##..##..##..#',
    '#......##......##......#',
    '#..##......##......##..#',
    '##########################',
  ],
  // Level 3
  [
    '##########################',
    '#..##..##......##..##..#',
    '#..#....####......#..#',
    '#..#..#......##..#..#',
    '#......####..####......#',
    '###..........#..####..#',
    '#....##..##......##..#',
    '#..##..##......##....#',
    '#......########......#',
    '#..##..#......#..##..#',
    '#..##..##..##..##..##..#',
    '#......##..##......#',
    '#..####..##..####..#',
    '#..#..........#..#',
    '#..#..######..#..#',
    '#....#......#....#',
    '#..##..##..##..#',
    '#......##......#',
    '#..##..##..##..#',
    '#....#......#....#',
    '#..#..######..#..#',
    '#..#..........#..#',
    '#..####..##..####..#',
    '#......##..##......#',
    '#..##..##..##..##..#',
    '##########################',
  ],
];

function createGrid(levelIndex) {
  const template = LEVELS[levelIndex % LEVELS.length];
  const g = [];
  for (let r = 0; r < ROWS; r++) {
    g[r] = new Array(COLS).fill(TILE.EMPTY);
    for (let c = 0; c < COLS; c++) {
      const ch = template[r][c];
      if (ch === '#') g[r][c] = TILE.BRICK;
      else if (ch === 'S') g[r][c] = TILE.STEEL;
      else if (ch === 'W') g[r][c] = TILE.WATER;
      else if (ch === 'B') g[r][c] = TILE.BASE;
    }
  }
  // Base in the center-bottom
  g[ROWS - 1][Math.floor(COLS / 2)] = TILE.BASE;
  g[ROWS - 1][Math.floor(COLS / 2) - 1] = TILE.BASE;
  g[ROWS - 2][Math.floor(COLS / 2)] = TILE.BASE;
  g[ROWS - 2][Math.floor(COLS / 2) - 1] = TILE.BASE;
  return g;
}

class Tank {
  constructor(x, y, dir, color, isPlayer = false) {
    this.x = x;
    this.y = y;
    this.dir = dir;
    this.color = color;
    this.isPlayer = isPlayer;
    this.speed = isPlayer ? 2 : 1;
    this.size = CELL - 4;
    this.hp = isPlayer ? 3 : 1;
    this.shootCooldown = 0;
    this.moveTimer = 0;
    this.aiDirChange = 0;
    this.flashTimer = 0;
  }

  draw(ctx) {
    if (this.flashTimer > 0 && this.flashTimer % 4 < 2) return;
    ctx.save();
    const cx = this.x + CELL / 2;
    const cy = this.y + CELL / 2;
    ctx.translate(cx, cy);
    const angle = [0, Math.PI / 2, Math.PI, -Math.PI / 2][this.dir];
    ctx.rotate(angle);

    const s = this.size / 2;
    // Tracks
    ctx.fillStyle = '#333';
    ctx.fillRect(-s, -s, s * 2, 4);
    ctx.fillRect(-s, s - 4, s * 2, 4);
    // Track details
    ctx.fillStyle = '#555';
    for (let i = -s + 3; i < s - 2; i += 5) {
      ctx.fillRect(i, -s, 3, 4);
      ctx.fillRect(i, s - 4, 3, 4);
    }
    // Body
    ctx.fillStyle = this.color;
    ctx.fillRect(-s + 3, -s + 5, s * 2 - 6, s * 2 - 10);
    // Barrel
    ctx.fillStyle = '#ddd';
    ctx.fillRect(-2, -s - 6, 4, s);
    // Turret
    ctx.fillStyle = this.isPlayer ? '#0a0' : '#a00';
    ctx.beginPath();
    ctx.arc(0, 0, s - 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  getBounds() {
    return {
      x: this.x + 2, y: this.y + 2,
      w: CELL - 4, h: CELL - 4,
    };
  }

  collidesWithTile(g) {
    const b = this.getBounds();
    const corners = [
      { x: b.x, y: b.y },
      { x: b.x + b.w, y: b.y },
      { x: b.x, y: b.y + b.h },
      { x: b.x + b.w, y: b.y + b.h },
    ];
    for (const pt of corners) {
      const col = Math.floor(pt.x / CELL);
      const row = Math.floor(pt.y / CELL);
      if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return true;
      const tile = g[row][col];
      if (tile === TILE.BRICK || tile === TILE.STEEL || tile === TILE.BASE) return true;
    }
    return false;
  }

  collidesWithTank(other) {
    const a = this.getBounds();
    const b = other.getBounds();
    return (
      a.x < b.x + b.w &&
      a.x + a.w > b.x &&
      a.y < b.y + b.h &&
      a.y + a.h > b.y
    );
  }

  move(dx, dy, dir, grid, allTanks) {
    this.dir = dir;
    const ox = this.x, oy = this.y;
    this.x += dx * this.speed;
    this.y += dy * this.speed;
    // Snap to grid alignment on perpendicular axis
    if (dir === DIR.UP || dir === DIR.DOWN) {
      const snapped = Math.round(this.x / 4) * 4;
      if (Math.abs(this.x - snapped) < this.speed) this.x = snapped;
    } else {
      const snapped = Math.round(this.y / 4) * 4;
      if (Math.abs(this.y - snapped) < this.speed) this.y = snapped;
    }
    if (this.collidesWithTile(grid)) {
      this.x = ox; this.y = oy;
      // Try sliding
      const snappedX = Math.round(this.x / 4) * 4;
      const snappedY = Math.round(this.y / 4) * 4;
      this.x = snappedX; this.y = snappedY;
      if (this.collidesWithTile(grid)) { this.x = ox; this.y = oy; return false; }
    }
    for (const t of allTanks) {
      if (t !== this && t.hp > 0 && this.collidesWithTank(t)) {
        this.x = ox; this.y = oy;
        return false;
      }
    }
    this.x = Math.max(0, Math.min(COLS * CELL - CELL, this.x));
    this.y = Math.max(0, Math.min(ROWS * CELL - CELL, this.y));
    return true;
  }

  shoot(bullets) {
    if (this.shootCooldown > 0) return null;
    this.shootCooldown = this.isPlayer ? PLAYER_SHOOT_DELAY : ENEMY_SHOOT_INTERVAL + Math.random() * 30;
    const cx = this.x + CELL / 2;
    const cy = this.y + CELL / 2;
    const speed = this.isPlayer ? 4 : 3;
    let bx = cx - 2, by = cy - 2;
    if (this.dir === DIR.UP) by = this.y - 4;
    else if (this.dir === DIR.DOWN) by = this.y + CELL;
    else if (this.dir === DIR.LEFT) bx = this.x - 4;
    else bx = this.x + CELL;
    const bullet = {
      x: bx, y: by, dir: this.dir, speed,
      isPlayer: this.isPlayer, active: true,
    };
    bullets.push(bullet);
    return bullet;
  }

  update() {
    if (this.shootCooldown > 0) this.shootCooldown--;
    if (this.flashTimer > 0) this.flashTimer--;
  }
}

function createExplosion(x, y, big = false) {
  for (let i = 0; i < (big ? 20 : 8); i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 4;
    explosions.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: big ? 25 : 15,
      color: Math.random() > 0.5 ? '#f80' : '#ff0',
    });
  }
}

function startGame() {
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('game-over-screen').style.display = 'none';
  level = 0;
  lives = 3;
  score = 0;
  gameRunning = true;
  gameOver = false;
  loadLevel();
  updateUI();
}

function loadLevel() {
  grid = createGrid(level);
  enemies = [];
  bullets = [];
  particles = [];
  explosions = [];
  player = new Tank(9 * CELL, (ROWS - 2) * CELL, DIR.UP, '#0a0', true);
  player.hp = 3;
  enemiesRemaining = 10 + level * 2;
  enemiesSpawned = 0;
  spawnTimer = 0;
  enemyShootTimer = 0;
  playerShootCooldown = 0;

  const indicator = document.getElementById('level-indicator');
  indicator.textContent = `第 ${level + 1} 关`;
  indicator.style.opacity = '1';
  setTimeout(() => { indicator.style.opacity = '0'; }, 1500);

  updateUI();
}

function spawnEnemy() {
  if (enemiesSpawned >= enemiesRemaining) return;
  const spawnPoints = [
    { x: 0, y: 0 },
    { x: (COLS / 2 - 1) * CELL, y: 0 },
    { x: (COLS - 1) * CELL, y: 0 },
  ];
  const pt = spawnPoints[Math.floor(Math.random() * 3)];
  // Check if spawn point is blocked
  const col = Math.floor(pt.x / CELL);
  const row = Math.floor(pt.y / CELL);
  if (grid[row] && grid[row][col] !== TILE.EMPTY) {
    // Clear spawn area
    for (let r = 0; r < 2; r++)
      for (let c = col - 1; c <= col + 1; c++)
        if (grid[r] && grid[r][c] === TILE.BRICK) grid[r][c] = TILE.EMPTY;
  }
  const colors = ['#e44', '#e84', '#e4e', '#4ae', '#ee4', '#4ee'];
  const color = colors[Math.floor(Math.random() * colors.length)];
  const enemy = new Tank(pt.x, pt.y, DIR.DOWN, color, false);
  // Make sure it doesn't collide with existing tanks
  let blocked = false;
  for (const t of enemies) {
    if (enemy.collidesWithTank(t)) { blocked = true; break; }
  }
  if (player && enemy.collidesWithTank(player)) blocked = true;
  if (blocked) return; // try again next frame
  enemies.push(enemy);
  enemiesSpawned++;
  updateUI();
}

function updateBullets() {
  for (const b of bullets) {
    if (!b.active) continue;
    const dx = [0, b.speed, 0, -b.speed][b.dir];
    const dy = [-b.speed, 0, b.speed, 0][b.dir];
    b.x += dx;
    b.y += dy;
    // Out of bounds
    if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
      b.active = false;
      createExplosion(b.x, b.y, false);
      continue;
    }
    // Hit tiles
    const col = Math.floor(b.x / CELL);
    const row = Math.floor(b.y / CELL);
    if (row >= 0 && row < ROWS && col >= 0 && col < COLS) {
      const tile = grid[row][col];
      if (tile === TILE.BRICK) {
        grid[row][col] = TILE.EMPTY;
        b.active = false;
        createExplosion(b.x, b.y, false);
        continue;
      } else if (tile === TILE.STEEL) {
        b.active = false;
        createExplosion(b.x, b.y, false);
        continue;
      } else if (tile === TILE.BASE) {
        grid[row][col] = TILE.EMPTY;
        b.active = false;
        createExplosion(b.x, b.y, true);
        endGame(false);
        return;
      }
    }
    // Hit player
    if (!b.isPlayer && player && player.hp > 0 && player.flashTimer <= 0) {
      const pb = player.getBounds();
      if (b.x >= pb.x && b.x <= pb.x + pb.w && b.y >= pb.y && b.y <= pb.y + pb.h) {
        b.active = false;
        player.hp--;
        player.flashTimer = 60;
        createExplosion(b.x, b.y, false);
        if (player.hp <= 0) {
          createExplosion(player.x + CELL / 2, player.y + CELL / 2, true);
          lives--;
          if (lives <= 0) { endGame(false); return; }
          // Respawn
          player.x = 9 * CELL;
          player.y = (ROWS - 2) * CELL;
          player.dir = DIR.UP;
          player.hp = 3;
          player.flashTimer = 90;
        }
        updateUI();
        continue;
      }
    }
    // Hit enemies
    if (b.isPlayer) {
      for (const enemy of enemies) {
        if (enemy.hp <= 0) continue;
        const eb = enemy.getBounds();
        if (b.x >= eb.x && b.x <= eb.x + eb.w && b.y >= eb.y && b.y <= eb.y + eb.h) {
          b.active = false;
          enemy.hp--;
          if (enemy.hp <= 0) {
            createExplosion(enemy.x + CELL / 2, enemy.y + CELL / 2, true);
            score += 100;
            enemiesRemaining--;
          }
          updateUI();
          break;
        }
      }
    }
  }
  bullets = bullets.filter(b => b.active || b.life > 0);
}

function updateExplosions() {
  for (const p of explosions) {
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
  }
  explosions = explosions.filter(p => p.life > 0);
}

function enemyAI(enemy) {
  if (enemy.hp <= 0) return;
  enemy.aiDirChange--;
  if (enemy.aiDirChange <= 0) {
    // Change direction sometimes
    const dirs = [DIR.UP, DIR.RIGHT, DIR.DOWN, DIR.LEFT];
    // Bias toward player
    if (player && player.hp > 0 && Math.random() < 0.4) {
      const dx = player.x - enemy.x;
      const dy = player.y - enemy.y;
      if (Math.abs(dx) > Math.abs(dy)) {
        enemy.dir = dx > 0 ? DIR.RIGHT : DIR.LEFT;
      } else {
        enemy.dir = dy > 0 ? DIR.DOWN : DIR.UP;
      }
    } else {
      enemy.dir = dirs[Math.floor(Math.random() * 4)];
    }
    enemy.aiDirChange = 20 + Math.floor(Math.random() * 60);
  }
  const dx = [0, 1, 0, -1][enemy.dir];
  const dy = [-1, 0, 1, 0][enemy.dir];
  const allTanks = [player, ...enemies].filter(t => t && t.hp > 0);
  enemy.move(dx, dy, enemy.dir, grid, allTanks);
}

function endGame(won) {
  gameRunning = false;
  gameOver = true;
  document.getElementById('game-over-screen').style.display = 'flex';
  document.getElementById('go-title').textContent = won ? 'YOU WIN!' : 'GAME OVER';
  document.getElementById('go-title').style.color = won ? '#0f0' : '#f00';
  document.getElementById('go-title').style.textShadow = won ? '0 0 20px #0f0' : '0 0 20px #f00';
  document.getElementById('final-score').textContent = score;
}

function updateUI() {
  document.getElementById('lives').textContent = lives;
  document.getElementById('score').textContent = score;
  document.getElementById('level').textContent = level + 1;
  document.getElementById('enemies-left').textContent = enemiesRemaining + Math.max(0, enemiesRemaining - enemiesSpawned);
}

function drawGrid() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const x = c * CELL, y = r * CELL;
      const tile = grid[r][c];
      if (tile === TILE.EMPTY) {
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(x, y, CELL, CELL);
        ctx.strokeStyle = '#222';
        ctx.strokeRect(x, y, CELL, CELL);
      } else if (tile === TILE.BRICK) {
        ctx.fillStyle = '#b55a30';
        ctx.fillRect(x, y, CELL, CELL);
        ctx.fillStyle = '#8b4513';
        ctx.fillRect(x + 1, y + 1, CELL / 2 - 1, CELL / 2 - 1);
        ctx.fillRect(x + CELL / 2, y + CELL / 2, CELL / 2 - 1, CELL / 2 - 1);
        ctx.strokeStyle = '#6b3410';
        ctx.strokeRect(x, y, CELL, CELL);
      } else if (tile === TILE.STEEL) {
        ctx.fillStyle = '#777';
        ctx.fillRect(x, y, CELL, CELL);
        ctx.fillStyle = '#999';
        ctx.fillRect(x + 2, y + 2, CELL - 4, CELL - 4);
        ctx.fillStyle = '#555';
        ctx.fillRect(x + 4, y + 4, CELL - 8, CELL - 8);
      } else if (tile === TILE.WATER) {
        ctx.fillStyle = '#2266cc';
        ctx.fillRect(x, y, CELL, CELL);
        ctx.fillStyle = '#3388ee';
        for (let i = 0; i < 3; i++) {
          const wy = y + (Date.now() / 500 + i * 6) % (CELL + 8) - 4;
          ctx.fillRect(x + 2, wy, CELL - 4, 3);
        }
      } else if (tile === TILE.BASE) {
        ctx.fillStyle = '#333';
        ctx.fillRect(x, y, CELL, CELL);
        ctx.fillStyle = '#ff0';
        ctx.beginPath();
        ctx.arc(x + CELL / 2, y + CELL / 2, CELL / 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.font = `${CELL * 0.55}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText('★', x + CELL / 2, y + CELL / 2 + 5);
      }
    }
  }
}

function drawExplosions() {
  for (const p of explosions) {
    const alpha = p.life / 25;
    ctx.fillStyle = p.color;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2 + (1 - alpha) * 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawGrid();
  for (const enemy of enemies) {
    if (enemy.hp > 0) enemy.draw(ctx);
  }
  if (player && player.hp > 0) player.draw(ctx);
  for (const b of bullets) {
    if (!b.active) continue;
    ctx.fillStyle = b.isPlayer ? '#fff' : '#faa';
    ctx.fillRect(b.x - 1, b.y - 1, 3, 3);
    ctx.fillStyle = b.isPlayer ? '#ff0' : '#f00';
    ctx.fillRect(b.x, b.y, 2, 2);
  }
  drawExplosions();
}

function update() {
  if (!gameRunning) return;

  // Player input
  if (player && player.hp > 0) {
    let moved = false;
    let mx = 0, my = 0, dir = player.dir;
    if (keys['KeyW'] || keys['ArrowUp']) { my = -1; dir = DIR.UP; moved = true; }
    else if (keys['KeyS'] || keys['ArrowDown']) { my = 1; dir = DIR.DOWN; moved = true; }
    else if (keys['KeyA'] || keys['ArrowLeft']) { mx = -1; dir = DIR.LEFT; moved = true; }
    else if (keys['KeyD'] || keys['ArrowRight']) { mx = 1; dir = DIR.RIGHT; moved = true; }

    if (moved) {
      const allTanks = [player, ...enemies].filter(t => t && t.hp > 0);
      player.move(mx, my, dir, grid, allTanks);
    }
    if (keys['Space'] || keys['KeyJ']) {
      player.shoot(bullets);
    }
    player.update();
  }

  // Spawn enemies
  spawnTimer++;
  const activeEnemies = enemies.filter(e => e.hp > 0).length;
  if (spawnTimer >= 80 && activeEnemies < 4 && enemiesSpawned < enemiesRemaining + enemiesRemaining) {
    spawnTimer = 0;
    spawnEnemy();
  }

  // Enemy AI
  for (const enemy of enemies) {
    if (enemy.hp <= 0) {
      enemies = enemies.filter(e => e !== enemy);
      continue;
    }
    enemyAI(enemy);
    enemy.update();
    // Enemy shooting
    enemyShootTimer++;
    if (enemyShootTimer % (ENEMY_SHOOT_INTERVAL + Math.floor(Math.random() * 30)) === 0) {
      enemy.shoot(bullets);
    }
  }

  // Remove dead enemies
  enemies = enemies.filter(e => e.hp > 0);

  updateBullets();
  updateExplosions();

  // Check win
  const aliveEnemies = enemies.filter(e => e.hp > 0).length;
  if (enemiesRemaining <= 0 && aliveEnemies === 0 && enemiesSpawned >= enemiesRemaining) {
    level++;
    if (level >= LEVELS.length) {
      endGame(true);
    } else {
      loadLevel();
    }
  }

  updateUI();
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

document.addEventListener('keydown', e => {
  keys[e.code] = true;
  e.preventDefault();
});
document.addEventListener('keyup', e => {
  keys[e.code] = false;
  e.preventDefault();
});

gameLoop();
// Show initial state
grid = createGrid(level || 0);
draw();
</script>
</body>
</html>
