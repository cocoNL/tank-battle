<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 - Tank Battle</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  font-family: 'Courier New', monospace;
}
#game-wrapper {
  position: relative;
  border: 3px solid #555;
  box-shadow: 0 0 30px rgba(0, 200, 0, 0.3);
}
canvas { display: block; background: #111; }
#ui {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 40px;
  color: #fff;
  font-size: 16px;
  pointer-events: none;
  z-index: 10;
}
#ui span { color: #0f0; font-weight: bold; }
#start-screen, #game-over-screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,0.88);
  color: #fff;
  z-index: 20;
}
#start-screen h1, #game-over-screen h1 {
  font-size: 48px;
  color: #0f0;
  margin-bottom: 20px;
  text-shadow: 0 0 20px #0f0;
}
#game-over-screen h1 { color: #f00; text-shadow: 0 0 20px #f00; }
#game-over-screen h1.win { color: #0f0; text-shadow: 0 0 20px #0f0; }
.controls { color: #aaa; font-size: 14px; margin-top: 20px; line-height: 1.8; text-align: center; }
.controls kbd {
  background: #333;
  border: 1px solid #666;
  border-radius: 3px;
  padding: 2px 6px;
  color: #fff;
}
.btn {
  margin-top: 20px;
  padding: 12px 40px;
  font-size: 20px;
  background: #0f0;
  color: #000;
  border: none;
  cursor: pointer;
  font-family: inherit;
  font-weight: bold;
  border-radius: 5px;
  transition: background 0.2s;
}
.btn:hover { background: #0c0; }
#game-over-screen { display: none; }
.hidden { display: none !important; }
#pause-overlay {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,0.75);
  color: #fff;
  z-index: 25;
  pointer-events: none;
}
#pause-overlay h2 {
  font-size: 42px;
  color: #ff0;
  margin-bottom: 12px;
  text-shadow: 0 0 20px #ff0;
}
#pause-overlay p {
  font-size: 16px;
  color: #ccc;
}
#level-indicator {
  position: absolute;
  top: 38%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #0f0;
  font-size: 36px;
  font-weight: bold;
  pointer-events: none;
  z-index: 15;
  opacity: 0;
  transition: opacity 0.3s;
  text-shadow: 0 0 20px #0f0;
}
</style>
</head>
<body>
<div id="game-wrapper">
  <canvas id="game"></canvas>
  <div id="ui">
    <div>生命 <span id="lives">3</span></div>
    <div>分数 <span id="score">0</span></div>
    <div>关卡 <span id="level">1</span></div>
    <div>剩余 <span id="enemies-left">0</span></div>
    <div>用时 <span id="time-display">00:00</span></div>
  </div>
  <div id="level-indicator"></div>
  <div id="pause-overlay">
    <h2>暂 停</h2>
    <p>按 空格键 继续</p>
  </div>
  <div id="start-screen">
    <h1>坦 克 大 战</h1>
    <p style="font-size:18px;color:#aaa;">BATTLE CITY</p>
    <div class="controls">
      <kbd>W A S D</kbd> 或 <kbd>&uarr; &larr; &darr; &rarr;</kbd> 移动<br>
      <kbd>空格</kbd> 或 <kbd>J</kbd> 射击
    </div>
    <button class="btn" id="start-btn">开始游戏</button>
  </div>
  <div id="game-over-screen">
    <h1 id="go-title">GAME OVER</h1>
    <p style="font-size:20px;color:#fff;">最终分数: <span id="final-score" style="color:#0f0;">0</span></p>
    <p style="font-size:16px;color:#aaa;margin-top:8px;">
      用时: <span id="final-time" style="color:#fff;">00:00</span>
      &nbsp;|&nbsp; 最佳: <span id="best-time" style="color:#ff0;">--:--</span>
    </p>
    <button class="btn" id="restart-btn">再来一局</button>
  </div>
</div>

<script>
(function() {
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const COLS = 26;
const ROWS = 26;
const CELL = 24;
canvas.width = COLS * CELL;
canvas.height = ROWS * CELL;

const TILE = { EMPTY: 0, BRICK: 1, STEEL: 2, BASE: 4 };
const DIR = { UP: 0, RIGHT: 1, DOWN: 2, LEFT: 3 };

// ----- State (all initialized before anything runs) -----
let grid = [];
let player = null;
let enemies = [];
let bullets = [];
let explosions = [];
let score = 0;
let lives = 3;
let level = 0;
let enemiesTotal = 0;
let enemiesSpawned = 0;
let enemiesKilled = 0;
let maxActiveEnemies = 4;
let gameRunning = false;
let gamePaused = false;
let keys = {};
let spawnTimer = 0;
let spawnDelay = 90;
let enemyShootCounter = 0;

// Heart / healing mechanic
let heart = null;           // { x, y, spawnTime }
let nextHeartTime = 0;      // timestamp when next heart may spawn
const HEART_DELAY = 15000;  // 15s between hearts
const HEART_DURATION = 10000; // 10s lifetime
const HEART_FLASH = 3000;   // flash during last 3s

// Timer
let gameStartTime = 0;
let bestTime = null;        // best completion time in seconds (from localStorage)
let totalPausedMs = 0;      // accumulated pause duration
let pauseStartTime = 0;     // when current pause began
let cheatBuffer = '';       // keystroke buffer for cheat detection
let cheatUsed = false;      // true if cheat was activated this game
let countdownEnd = 0;       // timestamp when 3-2-1 buffer ends
let countdownLabel = '';    // label shown above the countdown number

const PLAYER_SHOOT_DELAY = 12;
const PLAYER_SPEED = 2;
const ENEMY_SPEED = 1;
let enemyMoveSkip = 0;
// Level 1: half speed, Level 2: 2/3 speed, Level 3: full speed
let enemySpeedPattern = [true, false];
const BULLET_SPEED_PLAYER = 5;
const BULLET_SPEED_ENEMY = 3;

const LEVELS = [
  {
    name: '第一关',
    enemies: 8,
    map: [
      '##########################',
      '#............#...........#',
      '#..####..###....###..####..#',
      '#..#........#........#..#',
      '#..#..##..........##..#..#',
      '#......##..####..##......#',
      '#..##..#........#..##..#',
      '#..##..##......##..##..#',
      '#......##......##......#',
      '#..##..........##..#',
      '#..##..##....##....##..#',
      '#........#....#........#',
      '#..####..####..####..#',
      '#.....#........#.....#',
      '#.....#..####..#.....#',
      '###..#..#....#..#..###',
      '#......#....#......#',
      '#..##..##..##..##..#',
      '#....#........#....#',
      '#..##..####..##..#',
      '#......#....#......#',
      '#..##..........##..#',
      '#..##..####..##..####..#',
      '#........#........#..#',
      '#..####..###..###......#',
      '##########################',
    ]
  },
  {
    name: '第二关',
    enemies: 12,
    map: [
      '##########################',
      '#......##......##......#',
      '#..##..##..##..##..##..#',
      '#..##......##......##..#',
      '#..##..##..##..##..##..#',
      '#......##......##......#',
      '###..##..##..##..##..###',
      '#......##......##......#',
      '#..##..##..##..##..##..#',
      '#..##......##......##..#',
      '#..##..##..##..##..##..#',
      '#......##......##......#',
      '###..##..##..##..##..###',
      '#......##......##......#',
      '#..##..##..##..##..##..#',
      '#..##......##......##..#',
      '#..##..##..##..##..##..#',
      '#......##......##......#',
      '###..##..##..##..##..###',
      '#......##......##......#',
      '#..##..##..##..##..##..#',
      '#..##......##......##..#',
      '#..##..##..##..##..##..#',
      '#......##......##......#',
      '#..##......##......##..#',
      '##########################',
    ]
  },
  {
    name: '第三关',
    enemies: 16,
    map: [
      '##########################',
      '#..##..##......##..##..#',
      '#..#....####......#..#',
      '#..#..#......##..#..#',
      '#......####..####......#',
      '###..........#..####..#',
      '#....##..##......##..#',
      '#..##..##......##....#',
      '#......########......#',
      '#..##..#......#..##..#',
      '#..##..##..##..##..##..#',
      '#......##..##......#',
      '#..####..##..####..#',
      '#..#..........#..#',
      '#..#..######..#..#',
      '#....#......#....#',
      '#..##..##..##..#',
      '#......##......#',
      '#..##..##..##..#',
      '#....#......#....#',
      '#..#..######..#..#',
      '#..#..........#..#',
      '#..####..##..####..#',
      '#......##..##......#',
      '#..##..##..##..##..#',
      '##########################',
    ]
  },
];

// ----- Tank class -----
class Tank {
  constructor(x, y, dir, color, isPlayer = false) {
    this.x = x;
    this.y = y;
    this.dir = dir;
    this.color = color;
    this.isPlayer = isPlayer;
    this.speed = isPlayer ? PLAYER_SPEED : ENEMY_SPEED;
    this.halfSize = (CELL - 4) / 2;
    this.hp = 1;
    this.cooldown = 0;
    this.aiTimer = 20;
    this.flash = 0;
    this.alive = true;
  }

  get cx() { return this.x + CELL / 2; }
  get cy() { return this.y + CELL / 2; }

  bounds() {
    return { x: this.x + 3, y: this.y + 3, w: CELL - 6, h: CELL - 6 };
  }

  overlaps(other) {
    const a = this.bounds(), b = other.bounds();
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  collidesWithWorld(g) {
    const b = this.bounds();
    const pts = [
      [b.x, b.y], [b.x + b.w, b.y], [b.x, b.y + b.h], [b.x + b.w, b.y + b.h]
    ];
    for (const [px, py] of pts) {
      const c = Math.floor(px / CELL), r = Math.floor(py / CELL);
      if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return true;
      const t = g[r][c];
      if (t === TILE.BRICK || t === TILE.STEEL || t === TILE.BASE) return true;
    }
    return false;
  }

  move(dx, dy, g, allTanks) {
    const ox = this.x, oy = this.y;
    this.x += dx * this.speed;
    this.y += dy * this.speed;
    if (this.collidesWithWorld(g)) { this.x = ox; this.y = oy; return false; }
    for (const t of allTanks) {
      if (t !== this && t.alive && this.overlaps(t)) { this.x = ox; this.y = oy; return false; }
    }
    this.x = Math.max(0, Math.min(COLS * CELL - CELL, this.x));
    this.y = Math.max(0, Math.min(ROWS * CELL - CELL, this.y));
    return true;
  }

  fire() {
    if (this.cooldown > 0) return;
    this.cooldown = this.isPlayer ? PLAYER_SHOOT_DELAY : 30 + Math.floor(Math.random() * 30);
    const spd = this.isPlayer ? BULLET_SPEED_PLAYER : BULLET_SPEED_ENEMY;
    let bx = this.cx - 2, by = this.cy - 2;
    if (this.dir === DIR.UP)    by = this.y - 4;
    if (this.dir === DIR.DOWN)  by = this.y + CELL;
    if (this.dir === DIR.LEFT)  bx = this.x - 4;
    if (this.dir === DIR.RIGHT) bx = this.x + CELL;
    bullets.push({ x: bx, y: by, dir: this.dir, speed: spd, fromPlayer: this.isPlayer });
  }

  update() {
    if (this.cooldown > 0) this.cooldown--;
    if (this.flash > 0) this.flash--;
  }

  draw(ctx) {
    if (this.flash > 0 && this.flash % 6 < 3) return;
    ctx.save();
    ctx.translate(this.cx, this.cy);
    ctx.rotate([0, Math.PI / 2, Math.PI, -Math.PI / 2][this.dir]);
    const s = this.halfSize;
    // Tracks
    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect(-s, -s, s * 2, 4);
    ctx.fillRect(-s, s - 4, s * 2, 4);
    for (let i = -s + 3; i < s - 2; i += 5) {
      ctx.fillStyle = '#444';
      ctx.fillRect(i, -s, 3, 4);
      ctx.fillRect(i, s - 4, 3, 4);
    }
    // Body
    ctx.fillStyle = this.color;
    ctx.fillRect(-s + 3, -s + 5, s * 2 - 6, s * 2 - 10);
    // Barrel
    ctx.fillStyle = '#ccc';
    ctx.fillRect(-2, -s - 7, 4, s + 6);
    // Turret
    ctx.fillStyle = this.isPlayer ? '#0c0' : '#c22';
    ctx.beginPath();
    ctx.arc(0, 0, s - 5, 0, Math.PI * 2);
    ctx.fill();
    // Turret rim
    ctx.strokeStyle = this.isPlayer ? '#0a0' : '#a00';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  }
}

// ----- Helpers -----
function createGrid(levelIndex) {
  const lv = LEVELS[Math.min(levelIndex, LEVELS.length - 1)];
  const g = [];
  for (let r = 0; r < ROWS; r++) {
    g[r] = new Array(COLS).fill(TILE.EMPTY);
    for (let c = 0; c < COLS; c++) {
      const ch = lv.map[r] ? lv.map[r][c] : ' ';
      if (ch === '#') g[r][c] = TILE.BRICK;
      else if (ch === 'S') g[r][c] = TILE.STEEL;
    }
  }
  // Base bottom center with protective bricks
  const bc = Math.floor(COLS / 2);
  g[ROWS - 1][bc] = TILE.BASE;
  g[ROWS - 1][bc - 1] = TILE.BASE;
  g[ROWS - 2][bc] = TILE.BASE;
  g[ROWS - 2][bc - 1] = TILE.BASE;
  // Brick wall around base
  for (let c = bc - 2; c <= bc + 1; c++) {
    if (g[ROWS - 3][c] === TILE.EMPTY) g[ROWS - 3][c] = TILE.BRICK;
  }
  g[ROWS - 2][bc - 2] = TILE.BRICK;
  g[ROWS - 2][bc + 1] = TILE.BRICK;
  g[ROWS - 1][bc - 2] = TILE.BRICK;
  g[ROWS - 1][bc + 1] = TILE.BRICK;
  return g;
}

function spawnExplosion(x, y, big) {
  const n = big ? 18 : 7;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 1 + Math.random() * (big ? 5 : 3);
    explosions.push({
      x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
      life: big ? 22 : 12,
      color: Math.random() > 0.5 ? '#f80' : '#ff0',
    });
  }
}

function showIndicator(text) {
  const el = document.getElementById('level-indicator');
  el.textContent = text;
  el.style.opacity = '1';
  setTimeout(() => { el.style.opacity = '0'; }, 1800);
}

function startBuffer(label) {
  countdownEnd = Date.now() + 3000;
  countdownLabel = label;
  // Freeze game time: if not already paused, pause now for the buffer duration
  if (!gamePaused) {
    gamePaused = true;
    pauseStartTime = Date.now();
  }
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function gameNow() {
  const raw = Date.now();
  let now = raw - totalPausedMs;
  if (gamePaused) now -= (raw - pauseStartTime);
  return now;
}

function updateUI() {
  document.getElementById('lives').textContent = lives;
  document.getElementById('score').textContent = score;
  document.getElementById('level').textContent = level + 1;
  document.getElementById('enemies-left').textContent = enemiesTotal - enemiesKilled;
  if (gameStartTime > 0) {
    const elapsed = (gameNow() - gameStartTime) / 1000;
    document.getElementById('time-display').textContent = formatTime(elapsed);
  }
}

// ----- Spawn -----
function spawnEnemy() {
  if (enemiesSpawned >= enemiesTotal) return;
  const pts = [
    { x: 0 * CELL, y: 0 },
    { x: Math.floor(COLS / 2 - 1) * CELL, y: 0 },
    { x: (COLS - 1) * CELL, y: 0 },
  ];
  // Try random spawn point; clear bricks if needed
  const pt = pts[Math.floor(Math.random() * 3)];
  const col = Math.floor(pt.x / CELL), row = 0;
  for (let r = 0; r < 2; r++) {
    for (let c = col - 1; c <= col + 1; c++) {
      if (c >= 0 && c < COLS && r < ROWS && grid[r][c] === TILE.BRICK) {
        grid[r][c] = TILE.EMPTY;
      }
    }
  }
  const colors = ['#e55', '#e95', '#d5d', '#5ad', '#ed5', '#5ed'];
  const e = new Tank(pt.x, pt.y, DIR.DOWN, colors[Math.floor(Math.random() * colors.length)], false);
  if (player && player.alive && e.overlaps(player)) return;
  for (const t of enemies) { if (e.overlaps(t)) return; }
  enemies.push(e);
  enemiesSpawned++;
}

// ----- Game flow -----
function loadLevel() {
  grid = createGrid(level);
  enemies = [];
  bullets = [];
  explosions = [];
  const spawnCol = Math.floor(COLS / 2 - 1);
  const spawnRow = ROWS - 6;
  // Clear bricks tightly around player spawn (not reaching base wall)
  for (let r = spawnRow; r <= spawnRow + 1; r++) {
    for (let c = spawnCol - 1; c <= spawnCol + 1; c++) {
      if (r >= 0 && r < ROWS && c >= 0 && c < COLS && grid[r][c] === TILE.BRICK) {
        grid[r][c] = TILE.EMPTY;
      }
    }
  }
  player = new Tank(spawnCol * CELL, spawnRow * CELL, DIR.UP, '#4c4', true);
  // Enemy speed scales with level
  if (level === 0) enemySpeedPattern = [true, false];
  else if (level === 1) enemySpeedPattern = [true, true, false];
  else enemySpeedPattern = [true];
  enemiesTotal = LEVELS[Math.min(level, LEVELS.length - 1)].enemies;
  enemiesSpawned = 0;
  enemiesKilled = 0;
  spawnTimer = 0;
  maxActiveEnemies = 4;
  // Reset heart
  heart = null;
  nextHeartTime = 0;
  showIndicator(LEVELS[Math.min(level, LEVELS.length - 1)].name);
  // Start 3-2-1 buffer before level begins
  startBuffer(LEVELS[Math.min(level, LEVELS.length - 1)].name);
  updateUI();
}

function startGame() {
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('game-over-screen').style.display = 'none';
  level = 0;
  lives = 3;
  score = 0;
  gameRunning = true;
  gamePaused = false;
  cheatUsed = false;
  cheatBuffer = '';
  totalPausedMs = 0;
  countdownEnd = 0;
  countdownLabel = '';
  gameStartTime = Date.now();
  document.getElementById('pause-overlay').style.display = 'none';
  // Load best time from localStorage
  const saved = localStorage.getItem('tankBattleBestTime');
  bestTime = saved ? parseFloat(saved) : null;
  loadLevel();
}

function endGame(won) {
  gameRunning = false;
  gamePaused = false; // ensure no pause offset leaks
  const totalTime = (gameNow() - gameStartTime) / 1000;
  // Update best time if won and not cheated
  if (won && !cheatUsed && (bestTime === null || totalTime < bestTime)) {
    bestTime = totalTime;
    localStorage.setItem('tankBattleBestTime', bestTime);
  }
  const scr = document.getElementById('game-over-screen');
  scr.style.display = 'flex';
  const title = document.getElementById('go-title');
  if (won) {
    title.textContent = '胜 利 !';
    title.className = 'win';
  } else {
    title.textContent = 'GAME OVER';
    title.className = '';
  }
  document.getElementById('final-score').textContent = score;
  document.getElementById('final-time').textContent = formatTime(totalTime);
  document.getElementById('best-time').textContent = bestTime !== null ? formatTime(bestTime) : '--:--';
}

function nextLevel() {
  level++;
  if (level >= LEVELS.length) {
    endGame(true);
  } else {
    loadLevel();
  }
}

// ----- Update logic -----
function update() {
  if (!gameRunning) return;
  if (countdownEnd > 0) {
    if (Date.now() >= countdownEnd) {
      // Buffer finished — resume game
      countdownEnd = 0;
      countdownLabel = '';
      gamePaused = false;
      totalPausedMs += Date.now() - pauseStartTime;
      document.getElementById('pause-overlay').style.display = 'none';
    } else {
      updateUI();
      return;
    }
  }
  if (gamePaused) { updateUI(); return; }

  // ---- Player ----
  if (player && player.alive) {
    let mx = 0, my = 0, ndir = player.dir;
    if (keys['KeyW'] || keys['ArrowUp'])    { my = -1; ndir = DIR.UP; }
    if (keys['KeyS'] || keys['ArrowDown'])  { my = 1;  ndir = DIR.DOWN; }
    if (keys['KeyA'] || keys['ArrowLeft'])  { mx = -1; ndir = DIR.LEFT; }
    if (keys['KeyD'] || keys['ArrowRight']) { mx = 1;  ndir = DIR.RIGHT; }
    if (mx !== 0 || my !== 0) {
      player.dir = ndir;
      const all = [player, ...enemies].filter(t => t.alive);
      player.move(mx, my, grid, all);
    }
    if (keys['Space'] || keys['KeyJ']) {
      player.fire();
    }
    player.update();
  }
  if (!player) return;

  // ---- Spawn enemies ----
  spawnTimer++;
  const activeCount = enemies.filter(e => e.alive).length;
  if (spawnTimer >= spawnDelay && activeCount < maxActiveEnemies && enemiesSpawned < enemiesTotal) {
    spawnTimer = 0;
    spawnEnemy();
  }

  // ---- Enemy AI ----
  enemyShootCounter++;
  enemyMoveSkip++;
  for (const e of enemies) {
    if (!e.alive) continue;
    // Direction change
    e.aiTimer--;
    if (e.aiTimer <= 0) {
      if (player.alive && Math.random() < 0.45) {
        const dx = player.x - e.x, dy = player.y - e.y;
        e.dir = Math.abs(dx) > Math.abs(dy)
          ? (dx > 0 ? DIR.RIGHT : DIR.LEFT)
          : (dy > 0 ? DIR.DOWN : DIR.UP);
      } else {
        e.dir = Math.floor(Math.random() * 4);
      }
      e.aiTimer = 25 + Math.floor(Math.random() * 50);
    }
    // Move (speed scales with level via pattern)
    if (enemySpeedPattern[enemyMoveSkip % enemySpeedPattern.length]) {
      const all = [player, ...enemies].filter(t => t.alive);
      e.move([0, 1, 0, -1][e.dir], [-1, 0, 1, 0][e.dir], grid, all);
    }
    // Shoot randomly
    if (enemyShootCounter % 3 === 0 && Math.random() < 0.03) {
      e.fire();
    }
    e.update();
  }

  // Remove dead enemies
  enemies = enemies.filter(e => e.alive);

  // ---- Bullets ----
  for (const b of bullets) {
    const ddx = [0, b.speed, 0, -b.speed][b.dir];
    const ddy = [-b.speed, 0, b.speed, 0][b.dir];
    b.x += ddx;
    b.y += ddy;

    // Off-screen
    if (b.x < -8 || b.x > canvas.width + 8 || b.y < -8 || b.y > canvas.height + 8) {
      b.dead = true;
      continue;
    }
    // Tile hits
    const tc = Math.floor(b.x / CELL), tr = Math.floor(b.y / CELL);
    if (tr >= 0 && tr < ROWS && tc >= 0 && tc < COLS) {
      const tile = grid[tr][tc];
      if (tile === TILE.BRICK) {
        grid[tr][tc] = TILE.EMPTY;
        b.dead = true;
        spawnExplosion(b.x, b.y, false);
        continue;
      }
      if (tile === TILE.STEEL) {
        b.dead = true;
        spawnExplosion(b.x, b.y, false);
        continue;
      }
      if (tile === TILE.BASE) {
        grid[tr][tc] = TILE.EMPTY;
        b.dead = true;
        spawnExplosion(b.x, b.y, true);
        // Only game over when ALL base tiles destroyed
        let basesLeft = 0;
        for (let r = 0; r < ROWS; r++)
          for (let c = 0; c < COLS; c++)
            if (grid[r][c] === TILE.BASE) basesLeft++;
        if (basesLeft <= 0) {
          endGame(false);
          return;
        }
      }
    }
    // Hit player tank
    if (!b.fromPlayer && player && player.alive && player.flash <= 0) {
      const pb = player.bounds();
      if (b.x >= pb.x && b.x <= pb.x + pb.w && b.y >= pb.y && b.y <= pb.y + pb.h) {
        b.dead = true;
        player.flash = 60;
        if (--lives <= 0) {
          spawnExplosion(player.cx, player.cy, true);
          endGame(false);
          return;
        }
        // Respawn
        const sr = ROWS - 6;
        const sc = Math.floor(COLS / 2 - 1);
        for (let r = sr; r <= sr + 1; r++) {
          for (let c = sc - 1; c <= sc + 1; c++) {
            if (r >= 0 && r < ROWS && c >= 0 && c < COLS && grid[r][c] === TILE.BRICK) {
              grid[r][c] = TILE.EMPTY;
            }
          }
        }
        player.x = sc * CELL;
        player.y = sr * CELL;
        player.dir = DIR.UP;
        player.flash = 120;
        updateUI();
        continue;
      }
    }
    // Hit enemy tanks
    if (b.fromPlayer) {
      for (const e of enemies) {
        if (!e.alive) continue;
        const eb = e.bounds();
        if (b.x >= eb.x && b.x <= eb.x + eb.w && b.y >= eb.y && b.y <= eb.y + eb.h) {
          b.dead = true;
          e.alive = false;
          spawnExplosion(e.cx, e.cy, true);
          score += 100;
          enemiesKilled++;
          updateUI();
          break;
        }
      }
    }
  }
  bullets = bullets.filter(b => !b.dead);

  // ---- Explosions ----
  for (const p of explosions) { p.x += p.vx; p.y += p.vy; p.life--; }
  explosions = explosions.filter(p => p.life > 0);

  // ---- Heart / healing ----
  const now = gameNow();
  if (player && player.alive && lives < 3) {
    if (!heart) {
      if (nextHeartTime === 0) nextHeartTime = now + HEART_DELAY;
      if (now >= nextHeartTime) {
        // Spawn heart at random empty location
        let tries = 0;
        while (tries < 100) {
          const hc = 1 + Math.floor(Math.random() * (COLS - 2));
          const hr = 3 + Math.floor(Math.random() * (ROWS - 6));
          if (grid[hr][hc] === TILE.EMPTY) {
            // Make sure no tank is there
            let blocked = false;
            const hx = hc * CELL + CELL / 2;
            const hy = hr * CELL + CELL / 2;
            if (player && player.alive) {
              const pb = player.bounds();
              if (hx >= pb.x && hx <= pb.x + pb.w && hy >= pb.y && hy <= pb.y + pb.h) blocked = true;
            }
            for (const e of enemies) {
              if (!e.alive) continue;
              const eb = e.bounds();
              if (hx >= eb.x && hx <= eb.x + eb.w && hy >= eb.y && hy <= eb.y + eb.h) { blocked = true; break; }
            }
            if (!blocked) {
              heart = { x: hx, y: hy, spawnTime: now };
              nextHeartTime = 0;
              break;
            }
          }
          tries++;
        }
      }
    } else {
      // Heart exists - check pickup
      const elapsed = now - heart.spawnTime;
      if (elapsed >= HEART_DURATION) {
        // Expired
        heart = null;
        nextHeartTime = now + HEART_DELAY;
      } else {
        // Check player overlap
        const pb = player.bounds();
        const hsize = 10;
        if (Math.abs(player.cx - heart.x) < hsize + 8 && Math.abs(player.cy - heart.y) < hsize + 8) {
          // Picked up
          lives = Math.min(3, lives + 1);
          heart = null;
          nextHeartTime = now + HEART_DELAY;
          updateUI();
        }
      }
    }
  } else if (lives >= 3) {
    heart = null;
    nextHeartTime = 0;
  }

  // ---- Win check ----
  const alive = enemies.filter(e => e.alive).length;
  if (enemiesSpawned >= enemiesTotal && alive <= 0) {
    nextLevel();
    return;
  }

  updateUI();
}

// ---- Draw ----
function drawGrid() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const x = c * CELL, y = r * CELL;
      const tile = grid[r][c];
      if (tile === TILE.EMPTY) {
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(x, y, CELL, CELL);
        ctx.strokeStyle = '#222';
        ctx.strokeRect(x, y, CELL, CELL);
      } else if (tile === TILE.BRICK) {
        ctx.fillStyle = '#b55a30';
        ctx.fillRect(x, y, CELL, CELL);
        ctx.fillStyle = '#8b4513';
        ctx.fillRect(x + 1, y + 1, CELL / 2 - 2, CELL / 2 - 2);
        ctx.fillRect(x + CELL / 2 + 1, y + CELL / 2 + 1, CELL / 2 - 2, CELL / 2 - 2);
        ctx.strokeStyle = '#6b3410';
        ctx.lineWidth = 0.5;
        ctx.strokeRect(x, y, CELL, CELL);
      } else if (tile === TILE.STEEL) {
        ctx.fillStyle = '#666';
        ctx.fillRect(x, y, CELL, CELL);
        ctx.fillStyle = '#999';
        ctx.fillRect(x + 3, y + 3, CELL - 6, CELL - 6);
        ctx.fillStyle = '#555';
        ctx.fillRect(x + 5, y + 5, CELL - 10, CELL - 10);
      } else if (tile === TILE.BASE) {
        ctx.fillStyle = '#333';
        ctx.fillRect(x, y, CELL, CELL);
        ctx.fillStyle = '#ff0';
        ctx.beginPath();
        ctx.arc(x + CELL / 2, y + CELL / 2, CELL / 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.font = `bold ${CELL * 0.5}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('★', x + CELL / 2, y + CELL / 2 + 1);
      }
    }
  }
}

function drawBullets() {
  for (const b of bullets) {
    const c = b.fromPlayer ? '#ff0' : '#f66';
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.arc(b.x, b.y, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(b.x, b.y, 1.2, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawExplosions() {
  for (const p of explosions) {
    const a = p.life / 22;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2 + (1 - a) * 4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawHeart() {
  if (!heart) return;
  const now = gameNow();
  const elapsed = now - heart.spawnTime;
  const remaining = HEART_DURATION - elapsed;
  // Flash during last 3 seconds (toggle every 200ms)
  if (remaining < HEART_FLASH && Math.floor(remaining / 200) % 2 === 0) return;
  const x = heart.x, y = heart.y;
  const s = 6;
  ctx.save();
  ctx.translate(x, y);
  // Draw heart shape
  ctx.fillStyle = '#e33';
  ctx.beginPath();
  ctx.moveTo(0, s * 0.6);
  ctx.bezierCurveTo(-s, -s * 0.4, -s * 0.5, -s * 1.4, 0, -s * 0.8);
  ctx.bezierCurveTo(s * 0.5, -s * 1.4, s, -s * 0.4, 0, s * 0.6);
  ctx.fill();
  // Glow
  ctx.shadowColor = '#f66';
  ctx.shadowBlur = 8;
  ctx.fill();
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawGrid();
  for (const e of enemies) { if (e.alive) e.draw(ctx); }
  if (player && player.alive) player.draw(ctx);
  drawHeart();
  drawBullets();
  drawExplosions();
  drawCountdown();
}

function drawCountdown() {
  if (countdownEnd <= 0) return;
  const sec = Math.ceil((countdownEnd - Date.now()) / 1000);
  if (sec <= 0) return;
  // Semi-transparent overlay
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // Label
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(countdownLabel, canvas.width / 2, canvas.height / 2 - 50);
  // Countdown number
  ctx.fillStyle = '#0f0';
  ctx.font = 'bold 72px "Courier New", monospace';
  ctx.shadowColor = '#0f0';
  ctx.shadowBlur = 20;
  ctx.fillText(sec, canvas.width / 2, canvas.height / 2 + 10);
  ctx.shadowBlur = 0;
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// ----- Input -----
document.addEventListener('keydown', e => {
  // Pause / resume
  if (e.code === 'Escape' && gameRunning) {
    e.preventDefault();
    if (countdownEnd > 0) {
      // Cancel countdown, go back to pause
      countdownEnd = 0;
      countdownLabel = '';
      document.getElementById('pause-overlay').style.display = 'flex';
      return;
    }
    if (!gamePaused) {
      gamePaused = true;
      pauseStartTime = Date.now();
      document.getElementById('pause-overlay').style.display = 'flex';
    }
    return;
  }
  if (e.code === 'Space' && gameRunning && gamePaused && countdownEnd === 0) {
    e.preventDefault();
    startBuffer('继续');
    document.getElementById('pause-overlay').style.display = 'none';
    return;
  }
  // Cheat detection (works even during pause/countdown)
  if (e.key && e.key.length === 1 && /[a-zA-Z]/.test(e.key)) {
    cheatBuffer = (cheatBuffer + e.key.toLowerCase()).slice(-5);
    if (cheatBuffer === 'cheat') {
      cheatBuffer = '';
      cheatUsed = true;
      countdownEnd = 0; countdownLabel = ''; // cancel any active countdown
      gamePaused = false;
      document.getElementById('pause-overlay').style.display = 'none';
      if (level >= LEVELS.length - 1) {
        endGame(true);
      } else {
        level++;
        loadLevel();
      }
      return;
    }
  }

  if (gamePaused) return;

  keys[e.code] = true;
  if (['Space', 'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyJ',
       'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
    e.preventDefault();
  }
});
document.addEventListener('keyup', e => {
  keys[e.code] = false;
  if (['Space', 'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyJ',
       'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
    e.preventDefault();
  }
});

// ----- Buttons -----
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

// ----- Init and go -----
grid = createGrid(0);
gameLoop();
})();
</script>
